<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師遠端成績控制台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 sm:p-8">

    <!-- Simple Password Protection Overlay -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-xl flex items-center justify-center mx-auto text-xl">
                <span class="" aria-hidden="true">🔒</span>
            </div>
            <h2 class="text-lg font-bold text-white">教師身份驗證</h2>
            <p class="text-xs text-slate-400">請輸入教師存取密碼以查看全班成績</p>
            <input type="password" id="pass-input" placeholder="請輸入密碼" class="w-full bg-slate-950 border border-slate-800 text-center text-white py-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
            <button onclick="verifyPassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition">
                解鎖看板
            </button>
        </div>
    </div>

    <!-- Teacher Dashboard Header -->
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-5">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-xl shadow-lg shadow-indigo-600/10">
                    <span class="" aria-hidden="true">📈</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">資訊科技：教師遠端即時成績看板</h1>
                    <p class="text-xs text-slate-400 mt-0.5">學生作答提交後，成績會寫入 Google 試算表，此頁每 15 秒自動更新</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <span id="live-indicator" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    等待解鎖
                </span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                <div>
                    <div class="text-xs text-slate-400 font-medium mb-1">總提交人次</div>
                    <div id="stat-total-count" class="text-3xl font-black text-white">0</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400">
                    <span class="" aria-hidden="true">👥</span>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                <div>
                    <div class="text-xs text-slate-400 font-medium mb-1">班級平均分數</div>
                    <div id="stat-avg-score" class="text-3xl font-black text-emerald-400">0</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                    <span class="" aria-hidden="true">∑</span>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
                <div>
                    <div class="text-xs text-slate-400 font-medium mb-1">達標率 (≥80%)</div>
                    <div id="stat-pass-rate" class="text-3xl font-black text-indigo-400">0%</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                    <span class="" aria-hidden="true">★</span>
                </div>
            </div>
        </div>

        <!-- Student Score Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <span class="text-indigo-400" aria-hidden="true">☰</span>
                    <span>學生成績實時清單</span>
                </h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-200">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[11px] border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-4">座號</th>
                            <th class="py-3 px-4">姓名</th>
                            <th class="py-3 px-4">測驗題目</th>
                            <th class="py-3 px-4">得分 / 滿分</th>
                            <th class="py-3 px-4">提交時間</th>
                        </tr>
                    </thead>
                    <tbody id="teacher-score-tbody" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="5" class="py-12 text-center text-slate-500">請先輸入密碼解鎖</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Script for Dashboard Reading -->
    <script>
        // ★ 請貼上 Apps Script 部署後取得的「網頁應用程式網址」（與學生頁相同）
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxy2ZidUWqody-4myKKssqwlwWaTAwcJit75stVr1GoEwa3ZG5DVCfm7djk0eH3rFtY/exec";

        let teacherPw = "";
        const parseId = it => {
            if (it.seat !== undefined && it.seat !== null && it.seat !== '') {
                return { seat: Number(it.seat), name: it.name || String(it.studentName || '').replace(/^\s*\d+\s*/, '') };
            }
            const m = String(it.studentName || '').trim().match(/^(\d+)\s*[號号]?\s*[\/／、,，\-]?\s*(.*)$/);
            return m ? { seat: Number(m[1]), name: m[2] } : { seat: Infinity, name: String(it.studentName || '') };
        };
        let timer = null;

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function fetchScores(pw) {
            const res = await fetch(`${SHEET_API_URL}?pw=${encodeURIComponent(pw)}&t=${Date.now()}`);
            return res.json();
        }

        function setIndicator(ok) {
            const el = document.getElementById("live-indicator");
            if (ok) {
                el.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>已連線 Google 試算表（每 15 秒更新）`;
            } else {
                el.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center gap-2";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span>連線失敗，稍後重試`;
            }
        }

        async function refresh() {
            try {
                const data = await fetchScores(teacherPw);
                if (!data.ok) throw new Error(data.error);
                renderTeacherScoreboard(data.list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));
                setIndicator(true);
            } catch (e) {
                console.warn("refresh failed:", e);
                setIndicator(false);
            }
        }

        function renderTeacherScoreboard(list) {
            const tbody = document.getElementById("teacher-score-tbody");
            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500">尚無學生提交紀錄...</td></tr>`;
                document.getElementById("stat-total-count").innerText = 0;
                document.getElementById("stat-avg-score").innerText = 0;
                document.getElementById("stat-pass-rate").innerText = "0%";
                return;
            }

            // 同一座號只算一次：保留最早繳交的那筆，並依座號由小到大排列
            const first = {};
            list.forEach(it => {
                const p = parseId(it);
                const k = p.seat === Infinity ? 'n:' + p.name : 's:' + p.seat;
                if (!first[k] || (it.timestamp || 0) < (first[k].timestamp || 0)) first[k] = it;
            });
            list = Object.values(first).sort((a, b) => (parseId(a).seat - parseId(b).seat) || String(parseId(a).name).localeCompare(String(parseId(b).name)));
            let sumScore = 0;
            let passCount = 0;

            tbody.innerHTML = list.map(item => {
                const id = parseId(item);
                const score = Number(item.score) || 0;
                const maxScore = Number(item.maxScore) || 80;
                const ratio = score / maxScore;

                sumScore += score;
                if (ratio >= 0.8) passCount++;

                const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString('zh-TW', { hour12: false }) : '剛剛';

                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3.5 px-4 font-bold text-white">${id.seat === Infinity ? '-' : id.seat}</td>
                        <td class="py-3.5 px-4 font-bold text-white">${esc(id.name) || '未填寫'}</td>
                        <td class="py-3.5 px-4 text-slate-300">${esc(item.questionTitle) || '-'}</td>
                        <td class="py-3.5 px-4 font-black ${ratio >= 0.8 ? 'text-emerald-400' : 'text-amber-400'}">${score} / ${maxScore} 分</td>
                        <td class="py-3.5 px-4 text-slate-500 font-mono text-[11px]">${dateStr}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById("stat-total-count").innerText = list.length;
            document.getElementById("stat-avg-score").innerText = Math.round(sumScore / list.length);
            document.getElementById("stat-pass-rate").innerText = `${Math.round((passCount / list.length) * 100)}%`;
        }

        window.verifyPassword = async function() {
            if (!SHEET_API_URL) {
                alert("尚未設定試算表網址（SHEET_API_URL）");
                return;
            }
            const input = document.getElementById("pass-input").value;
            try {
                const data = await fetchScores(input);
                if (!data.ok) {
                    alert("密碼錯誤！");
                    return;
                }
                teacherPw = input;
                document.getElementById("auth-modal").classList.add("hidden");
                renderTeacherScoreboard(data.list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));
                setIndicator(true);
                timer = setInterval(refresh, 15000);
            } catch (e) {
                alert("無法連線到試算表，請確認網址與部署權限設定");
            }
        };

        document.getElementById("pass-input").addEventListener("keydown", e => {
            if (e.key === "Enter") window.verifyPassword();
        });
    </script>
</body>
</html>
