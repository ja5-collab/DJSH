<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch 作業：教師成績看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 sm:p-8">

    <div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 bg-amber-500/20 border border-amber-500/30 rounded-xl flex items-center justify-center mx-auto text-xl">🔒</div>
            <h2 class="text-lg font-bold text-white">教師身份驗證</h2>
            <p class="text-xs text-slate-400">請輸入教師存取密碼以查看全班繳交狀況</p>
            <input type="password" id="pass-input" placeholder="請輸入密碼" class="w-full bg-slate-950 border border-slate-800 text-center text-white py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-500">
            <button onclick="verifyPassword()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-2.5 rounded-xl text-sm transition">解鎖看板</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-5">
            <div>
                <h1 class="text-xl font-bold text-white">Scratch 繪圖作業：教師成績看板</h1>
                <p class="text-xs text-slate-400 mt-0.5">學生每繳交一題，紀錄會寫入 Google 試算表，此頁每 15 秒自動更新</p>
            </div>
            <span id="live-indicator" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-slate-500"></span>等待解鎖
            </span>
        </header>

        <div class="grid grid-cols-1 gap-4 max-w-xs">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <div class="text-xs text-slate-400 font-medium mb-1">已繳交學生數</div>
                <div id="stat-students" class="text-3xl font-black text-white">0</div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between mb-1">
                <h2 class="text-sm font-bold text-slate-200">各題繳交狀況（每人每題取最新一次繳交）</h2>
                <input id="filter-input" type="text" placeholder="搜尋座號或姓名" class="bg-slate-950 border border-slate-800 text-xs text-white px-3 py-1.5 rounded-lg focus:outline-none focus:border-amber-500 w-40" oninput="rerender()">
            </div>
            <p class="text-[11px] text-slate-500 mb-3">綠色 = 檢測全部通過；黃色 = 已繳交但有項目未通過（滑鼠移上去看未通過項目）；— = 尚未繳交。「繳交人數」以全班已有紀錄的學生為基準，不受搜尋影響。</p>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-200">
                    <thead id="matrix-thead" class="bg-slate-950 text-slate-400 text-[11px] border-b border-slate-800"></thead>
                    <tbody id="matrix-tbody" class="divide-y divide-slate-800/60">
                        <tr><td class="py-12 text-center text-slate-500">請先輸入密碼解鎖</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-sm font-bold text-slate-200 mb-3">繳交紀錄（最新在最上面）</h2>
            <div class="overflow-x-auto max-h-96 overflow-y-auto">
                <table class="w-full text-left text-xs text-slate-200">
                    <thead class="bg-slate-950 text-slate-400 text-[11px] border-b border-slate-800 sticky top-0">
                        <tr>
                            <th class="py-3 px-4">時間</th>
                            <th class="py-3 px-4">座號 / 姓名</th>
                            <th class="py-3 px-4">任務</th>
                            <th class="py-3 px-4">檔案</th>
                            <th class="py-3 px-4">通過項數</th>
                            <th class="py-3 px-4">未通過項目</th>
                        </tr>
                    </thead>
                    <tbody id="log-tbody" class="divide-y divide-slate-800/60"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ★ 請貼上 Apps Script 部署後取得的「網頁應用程式網址」（與學生頁相同）
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbx4SoQfpd6zhVbd42xesc8Hl1FIJg4m12_LfMsvgFoUx8zm17Qlv9BreC2KrNTXeKBx/exec";

        const TASKS = [
            { id: 1, name: "直線回原點" },
            { id: 2, name: "折線與轉角度" },
            { id: 3, name: "正五邊形" },
            { id: 4, name: "迴圈正八邊形" },
            { id: 5, name: "輸入邊數畫正 N 邊形" },
            { id: 6, name: "輸入邊數邊長畫圖" }
        ];

        let teacherPw = "";
        let allRows = [];

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function fetchScores(pw) {
            const res = await fetch(`${SHEET_API_URL}?pw=${encodeURIComponent(pw)}&t=${Date.now()}`);
            return res.json();
        }

        function setIndicator(ok) {
            const el = document.getElementById("live-indicator");
            if (ok) {
                el.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>已連線 Google 試算表（每 15 秒更新）`;
            } else {
                el.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center gap-2";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span>連線失敗，稍後重試`;
            }
        }

        async function refresh() {
            try {
                const data = await fetchScores(teacherPw);
                if (!data.ok) throw new Error(data.error);
                allRows = data.list;
                rerender();
                setIndicator(true);
            } catch (e) {
                console.warn("refresh failed:", e);
                setIndicator(false);
            }
        }

        function fmtTime(ts) {
            return ts ? new Date(ts).toLocaleString('zh-TW', { hour12: false }) : '-';
        }

        function rerender() {
            // students[name][taskId] = latest row
            const students = {};
            allRows.forEach(r => {
                const name = String(r.studentName || '未填寫');
                const id = Number(r.taskId);
                if (!students[name]) students[name] = {};
                const cur = students[name][id];
                if (!cur || (r.timestamp || 0) >= (cur.timestamp || 0)) students[name][id] = r;
            });

            const names = Object.keys(students).sort((a, b) => a.localeCompare(b, 'zh-TW', { numeric: true }));
            document.getElementById("stat-students").innerText = names.length;

            // matrix: rows = tasks, columns = students
            const kw = document.getElementById("filter-input").value.trim().toLowerCase();
            const shown = names.filter(n => n.toLowerCase().includes(kw));
            const thead = document.getElementById("matrix-thead");
            const tbody = document.getElementById("matrix-tbody");

            thead.innerHTML = `<tr>
                <th class="py-3 px-4 whitespace-nowrap sticky left-0 bg-slate-950 z-10">任務</th>
                <th class="py-3 px-3 text-center whitespace-nowrap sticky left-[9rem] bg-slate-950 z-10">繳交人數</th>
                ${shown.map(n => `<th class="py-3 px-3 text-center whitespace-nowrap text-slate-300">${esc(n)}</th>`).join('')}
            </tr>`;

            if (shown.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="py-10 text-center text-slate-500">${names.length ? '沒有符合的學生' : '尚無學生繳交紀錄...'}</td></tr>`;
            } else {
                tbody.innerHTML = TASKS.map(t => {
                    let submitted = 0, passedAll = 0;
                    names.forEach(n => {
                        const r = students[n][t.id];
                        if (r) {
                            submitted++;
                            if (Number(r.passed) === Number(r.total)) passedAll++;
                        }
                    });

                    const cells = shown.map(n => {
                        const r = students[n][t.id];
                        if (!r) return `<td class="py-3 px-3 text-center text-slate-600">—</td>`;
                        const ok = Number(r.passed) === Number(r.total);
                        const tip = esc(`${r.fileName || ''}｜${fmtTime(r.timestamp)}` + (ok ? '' : `｜未通過：${r.failed || ''}`));
                        return `<td class="py-3 px-3 text-center" title="${tip}"><span class="inline-block px-2.5 py-1 rounded-lg font-bold whitespace-nowrap ${ok ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'}">${ok ? '✔ ' : ''}${Number(r.passed)}/${Number(r.total)}</span></td>`;
                    }).join('');

                    return `<tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3 px-4 font-bold text-white whitespace-nowrap sticky left-0 bg-slate-900 z-10 w-36 min-w-[9rem]">任務 ${t.id}<br><span class="font-normal text-[11px] text-slate-400">${esc(t.name)}</span></td>
                        <td class="py-3 px-3 text-center whitespace-nowrap sticky left-[9rem] bg-slate-900 z-10">
                            <div class="font-black text-base ${submitted ? 'text-amber-400' : 'text-slate-600'}">${submitted} / ${names.length}</div>
                            <div class="text-[11px] text-emerald-400">全數通過 ${passedAll} 人</div>
                        </td>
                        ${cells}
                    </tr>`;
                }).join('');
            }

            // log
            const logs = [...allRows].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            document.getElementById("log-tbody").innerHTML = logs.length ? logs.map(r => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="py-2.5 px-4 text-slate-500 font-mono text-[11px] whitespace-nowrap">${fmtTime(r.timestamp)}</td>
                    <td class="py-2.5 px-4 font-bold text-white">${esc(r.studentName) || '未填寫'}</td>
                    <td class="py-2.5 px-4 text-slate-300">任務 ${esc(r.taskId)}</td>
                    <td class="py-2.5 px-4 text-slate-400">${esc(r.fileName) || '-'}</td>
                    <td class="py-2.5 px-4 font-bold ${Number(r.passed) === Number(r.total) ? 'text-emerald-400' : 'text-amber-400'}">${Number(r.passed)} / ${Number(r.total)}</td>
                    <td class="py-2.5 px-4 text-slate-400">${esc(r.failed) || '—'}</td>
                </tr>`).join('') : `<tr><td colspan="6" class="py-6 text-center text-slate-500">尚無紀錄</td></tr>`;
        }

        window.verifyPassword = async function() {
            if (!SHEET_API_URL) {
                alert("尚未設定試算表網址（SHEET_API_URL）");
                return;
            }
            const input = document.getElementById("pass-input").value;
            try {
                const data = await fetchScores(input);
                if (!data.ok) {
                    alert("密碼錯誤！");
                    return;
                }
                teacherPw = input;
                allRows = data.list;
                document.getElementById("auth-modal").classList.add("hidden");
                rerender();
                setIndicator(true);
                setInterval(refresh, 15000);
            } catch (e) {
                alert("無法連線到試算表，請確認網址與部署權限設定");
            }
        };

        document.getElementById("pass-input").addEventListener("keydown", e => {
            if (e.key === "Enter") window.verifyPassword();
        });
    </script>
</body>
</html>
